name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a new push waits for the previous run.
concurrency:
  group: deploy-ev-template
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/tech-trendo/ev-template-backend
  FRONTEND_IMAGE: ghcr.io/tech-trendo/ev-template-frontend
  VPS_DIR: /opt/ev-template

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.VPS_DIR }}
          overwrite: true

      - name: Pull and restart containers
        uses: appleboy/ssh-action@v1.2.5
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:latest
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:latest
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_DEPLOY_TOKEN,GHCR_USERNAME
          script_stop: true
          script: |
            set -eu
            cd /opt/ev-template

            if [ ! -f .env ]; then
              echo "ERROR: /opt/ev-template/.env is missing. Copy .env.example to .env and edit it first."
              exit 1
            fi

            # Load HOST_PORT, COMPOSE_PROJECT_NAME, etc. into this shell.
            set -a
            . ./.env
            set +a

            export BACKEND_IMAGE="${BACKEND_IMAGE:?}"
            export FRONTEND_IMAGE="${FRONTEND_IMAGE:?}"
            export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-ev-template}"

            echo "==> Project: ${COMPOSE_PROJECT_NAME} | host port: ${HOST_PORT:-3001}"

            if [ -n "${GHCR_DEPLOY_TOKEN:-}" ]; then
              echo "==> Logging in to GHCR…"
              echo "$GHCR_DEPLOY_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            echo "==> Pulling images…"
            docker compose pull

            echo "==> Starting containers…"
            docker compose up -d --remove-orphans

            echo "==> Waiting for backend health…"
            backend_cid="$(docker compose ps -q backend)"
            status=""
            for _ in $(seq 1 30); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$backend_cid" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                break
              fi
              sleep 3
            done
            echo "Backend health: ${status:-unknown}"
            if [ "${status:-}" != "healthy" ]; then
              docker compose logs --tail 80 backend || true
              exit 1
            fi

            echo "==> Frontend check…"
            curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' "http://127.0.0.1:${HOST_PORT:-3001}/auth/login" || true

            echo "==> Pruning dangling images…"
            docker image prune -f

            echo "==> Deploy done."
